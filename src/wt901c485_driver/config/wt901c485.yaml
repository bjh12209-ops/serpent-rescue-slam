wt901c485_node:
  ros__parameters:
    # Use the USB identity instead of ttyUSB0, whose number changes with plug order.
    port: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
    baud_rate: 115200
    sensor_ids: [82]  # 0x52 is the only responding sensor on this robot.
    rate_hz: 60.0
    response_timeout_us: 12000
    offline_retry_ms: 1000
    yaw_zero_duration_sec: 2.0
    frame_prefix: imu

    # Initial conservative variances. Replace these with values measured from
    # a stationary rosbag (Allan variance for gyro/accel) after the pipeline works.
    orientation_covariance: [0.01, 0.0, 0.0,
                             0.0, 0.01, 0.0,
                             0.0, 0.0, 0.25]
    angular_velocity_covariance: [0.0025, 0.0, 0.0,
                                  0.0, 0.0025, 0.0,
                                  0.0, 0.0, 0.0025]
    linear_acceleration_covariance: [0.04, 0.0, 0.0,
                                     0.0, 0.04, 0.0,
                                     0.0, 0.0, 0.04]
