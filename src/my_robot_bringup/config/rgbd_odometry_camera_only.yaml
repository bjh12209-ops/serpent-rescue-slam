rgbd_odometry:
  ros__parameters:
    frame_id: base_link
    odom_frame_id: odom

    # Camera-only mode has no EKF, so RGB-D odometry is the sole publisher of
    # odom -> base_link. Never load this file together with ekf.yaml.
    publish_tf: true
    wait_for_transform: 0.2
    wait_imu_to_init: false
    always_check_imu_tf: false

    # The D435 color and aligned-depth streams can differ by a few
    # milliseconds even with enable_sync. Exact sync then blocks odometry
    # completely, so pair only frames that are at most 20 ms apart.
    approx_sync: true
    approx_sync_max_interval: 0.02
    topic_queue_size: 10
    sync_queue_size: 20
    qos: 2
    qos_camera_info: 2

    Odom/Strategy: "0"
    Odom/ResetCountdown: "1"
    OdomF2M/MaxSize: "2000"
    Vis/MinInliers: "20"
    Vis/MaxFeatures: "1500"
    Vis/MaxDepth: "5.0"
