ekf_filter_node:
  ros__parameters:
    frequency: 60.0
    sensor_timeout: 0.2
    two_d_mode: false
    publish_tf: true
    publish_acceleration: false
    print_diagnostics: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # RTAB-Map RGB-D visual odometry. The topic is /visual_odom and its
    # header.frame_id is odom, but its TF output is disabled. This EKF is the
    # only publisher of odom -> base_link.
    odom0: /visual_odom
    odom0_config: [true,  true,  true,
                   true,  true,  true,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10
    odom0_nodelay: false

    # WT901C485 0x52. Fuse gravity-referenced roll/pitch and angular rates.
    # Yaw orientation is intentionally excluded because this 6-axis mode has
    # arbitrary startup yaw and no absolute heading reference.
    imu0: /imu_52/data
    imu0_config: [false, false, false,
                  true,  true,  false,
                  false, false, false,
                  true,  true,  true,
                  false, false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_queue_size: 30
    imu0_nodelay: false
    imu0_remove_gravitational_acceleration: false

    transform_time_offset: 0.0
    transform_timeout: 0.1
